name: Update Animated Languages SVG

on:
  schedule:
    - cron: "0 6 * * *"   # Cada día a las 06:00 UTC
  workflow_dispatch:        # Permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - "scripts/generate_languages_svg.py"
      - ".github/workflows/languages-svg.yml"

permissions:
  contents: write

jobs:
  build-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate animated SVG
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: assets/languages.svg
          MIN_PERCENTAGE: "0.1"
        run: python scripts/generate_languages_svg.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update animated languages SVG"
            git pull --rebase --autostash origin main
            git push
          fi
